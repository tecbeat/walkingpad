---
# Local ESPHome dashboard for building Bluetooth Proxy firmware.
#
# NOT a production deployment. The ESPHome dashboard is used only to author
# YAML configs, compile firmware, and (optionally) push OTA updates once a
# proxy is on Wi-Fi.
#
# First-flash of a fresh ESP32 happens through the browser via WebSerial at
# https://web.esphome.io/ -- no USB passthrough into this container is needed.
#
# Usage:
#   docker compose -f docker-compose.esphome.yml up -d
#   open http://127.0.0.1:6052
#   docker compose -f docker-compose.esphome.yml down
#
# Config files live in dev/esphome/. The build cache (.esphome/) and any
# secrets.yaml the dashboard writes are gitignored.
services:
  esphome:
    image: ghcr.io/esphome/esphome:2026.7.4@sha256:e636269c6390c2124916510d45f55febb1d9ce41365f8445c9083ee41e43c92b
    container_name: esphome
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
      USERNAME: admin
      PASSWORD: ${ESPHOME_DASHBOARD_PASSWORD}
    volumes:
      - ./dev/esphome:/config
    ports:
      - "127.0.0.1:6052:6052"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:6052/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
